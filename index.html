<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Warrior Recolor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Warrior Recolor Demo</h1>
    <p>Use the color pickers to change the color of each layer.</p>
    <div class="main-container">
        <div class="canvas-container">
            <canvas id="warriorCanvas" width="512" height="768"></canvas>
            <div id="loading">Loading assets...</div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="hairColor">Hair</label>
                <input type="color" id="hairColor" value="#554236">
            </div>
            <div class="control-group">
                <label for="skinColor">Skin</label>
                <input type="color" id="skinColor" value="#C58C85">
            </div>
            <div class="control-group">
                <label for="armorBaseColor">Armor Base</label>
                <input type="color" id="armorBaseColor" value="#4A6A8A">
            </div>
            <div class="control-group">
                <label for="armorTrimColor">Armor Trim</label>
                <input type="color" id="armorTrimColor" value="#FFD700">
            </div>
             <button id="resetButton">Reset Colors</button>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
